
name: Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent two graph-generation runs from pushing simultaneously.
concurrency:
  group: activity-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  activity-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate animated contribution graph
        uses: alexcerezo/activity-graph@v1
        with:
          username: YASVANTHKUMAR23
          token: ${{ secrets.GITHUB_TOKEN }}
